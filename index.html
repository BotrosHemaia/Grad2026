<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CALLED — Seat Reservation</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%93%3C/text%3E%3C/svg%3E" />

    <!-- Preconnect for faster font loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Elegant serif for headings (Playfair Display) + clean sans for body (Inter) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <link
      href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css"
      rel="stylesheet"
    />

    <!-- Tailwind CSS (CDN build) with a custom "University Graduation" theme extension.
         IMPORTANT: the config script must come AFTER the CDN <script> tag and assign
         to `tailwind.config` (not `tailwind = {...}`), otherwise the CDN script's own
         initialization overwrites/ignores it and the custom colors silently no-op. -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              navy: {
                50: '#eef1f8',
                100: '#d7deef',
                200: '#b3c1de',
                300: '#8aa0cb',
                400: '#5b78ac',
                500: '#385791',
                600: '#25406f',
                700: '#1b2f57',
                800: '#12203f',
                900: '#0a1530',
                950: '#060d1e',
              },
              gold: {
                50: '#fdf8ec',
                100: '#faedc4',
                200: '#f5db8f',
                300: '#efc55a',
                400: '#e6b13a',
                500: '#d4a72c',
                600: '#b38720',
                700: '#8a6a1c',
                800: '#6b521a',
                900: '#4a3812',
              },
            },
            fontFamily: {
              display: ['"Playfair Display"', 'serif'],
              sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
            },
            boxShadow: {
              'gold-glow': '0 8px 24px -6px rgba(212, 167, 44, 0.45)',
              'navy-lg': '0 20px 45px -15px rgba(10, 21, 48, 0.35)',
            },
          },
        },
      }
    </script>

    <style>
      html, body { font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; scroll-behavior: smooth; }
      .font-display { font-family: 'Playfair Display', serif; }
      /* Smooth, momentum-based swiping for the seat map on touch devices */
      .scroll-touch { -webkit-overflow-scrolling: touch; }
      /* Thin, elegant scrollbar for the horizontally scrollable seat map */
      .thin-scrollbar::-webkit-scrollbar { height: 8px; }
      .thin-scrollbar::-webkit-scrollbar-track { background: #eef1f8; border-radius: 8px; }
      .thin-scrollbar::-webkit-scrollbar-thumb { background: #b3c1de; border-radius: 8px; }
      .thin-scrollbar::-webkit-scrollbar-thumb:hover { background: #8aa0cb; }
    </style>
  </head>
  <body class="bg-gray-50 text-navy-900">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
